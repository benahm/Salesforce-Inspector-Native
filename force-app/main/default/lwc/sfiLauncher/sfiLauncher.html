<template>
  <div class="sfi-launcher" style={rootStyle}>
    <!-- Compact tab bar -->
    <div class="slds-tabs_default sfi-tabs">
      <ul class="slds-tabs_default__nav" role="tablist">
        <template for:each={tabs} for:item="tab">
          <li key={tab.value} class={tab.itemClass} role="presentation">
            <a
              class="slds-tabs_default__link"
              role="tab"
              href="#"
              aria-selected={tab.selected}
              data-tab={tab.value}
              onclick={handleTab}
            >
              <template lwc:if={tab.icon}>
                <lightning-icon
                  icon-name={tab.icon}
                  size="xx-small"
                  class="slds-m-right_xx-small sfi-tab-icon"
                ></lightning-icon>
              </template>
              {tab.label}
            </a>
          </li>
        </template>
        <li
          class="sfi-version slds-col_bump-left slds-text-body_small slds-text-color_weak"
          role="presentation"
        >
          SFI Native v{version}
        </li>
      </ul>
    </div>

    <div class="sfi-body">
      <!-- Context tab: record, object or manual Id -->
      <template lwc:if={isContextTab}>
        <template lwc:if={isLoadingContext}>
          <div class="sfi-spinner-holder">
            <lightning-spinner
              alternative-text="Loading"
              size="small"
            ></lightning-spinner>
          </div>
        </template>

        <template lwc:if={contextError}>
          <div
            class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_x-small"
            role="alert"
          >
            {contextError}
          </div>
        </template>

        <template lwc:if={hasRecord}>
          <div
            class="slds-grid slds-grid_vertical-align-start slds-m-bottom_x-small"
          >
            <div class="slds-col slds-truncate">
              <p class="slds-text-title_caps slds-truncate">
                {objectLabel} (<span class="sfi-mono">{objectApiName}</span>)
              </p>
              <p
                class="slds-text-heading_small slds-truncate"
                title={recordTitle}
              >
                {recordTitle}
              </p>
              <p>
                <span class="sfi-mono">{record.recordId}</span>
                <lightning-button-icon
                  icon-name="utility:copy"
                  variant="bare"
                  size="small"
                  alternative-text="Copy Id"
                  title="Copy Id"
                  data-value={record.recordId}
                  onclick={handleCopy}
                  class="slds-m-left_xx-small"
                ></lightning-button-icon>
              </p>
            </div>
            <div class="slds-no-flex">
              <a
                href={showAllDataUrl}
                target="_blank"
                class="slds-button slds-button_brand"
                >Show All Data</a
              >
              <a
                href={recordViewUrl}
                target="_blank"
                class="slds-button slds-button_neutral"
                >Open record</a
              >
            </div>
          </div>

          <p class="slds-text-body_small slds-m-bottom_x-small sfi-links">
            <span class="slds-text-color_weak">Links</span>
            <template for:each={setupLinks} for:item="link">
              <a key={link.key} href={link.url} target="_blank">{link.label}</a>
            </template>
          </p>

          <div class="slds-grid slds-wrap slds-m-bottom_x-small sfi-summary">
            <template for:each={summaryRows} for:item="row">
              <div
                key={row.name}
                class="slds-size_1-of-2 slds-truncate slds-text-body_small slds-p-right_x-small"
              >
                <span class="slds-text-color_weak">{row.label}:</span>
                <template lwc:if={row.url}>
                  <a
                    href={row.url}
                    target="_blank"
                    class="sfi-mono slds-m-left_xx-small"
                    >{row.value}</a
                  >
                </template>
                <template lwc:else>
                  <span class="slds-m-left_xx-small">{row.value}</span>
                </template>
              </div>
            </template>
          </div>

          <lightning-input
            type="search"
            variant="label-hidden"
            placeholder="Filter fields by label, API name or value"
            value={fieldFilter}
            onchange={handleFieldFilter}
          ></lightning-input>
          <div class="sfi-fill slds-m-top_xx-small">
            <table
              class="slds-table slds-table_bordered slds-table_fixed-layout sfi-table"
            >
              <tbody>
                <template for:each={fieldRows} for:item="field">
                  <tr key={field.name}>
                    <td
                      class="slds-truncate sfi-field-name"
                      title={field.label}
                    >
                      {field.label}<br />
                      <span class="sfi-mono slds-text-color_weak"
                        >{field.name}</span
                      >
                    </td>
                    <td
                      class="sfi-value"
                      data-value={field.value}
                      onclick={handleCopy}
                      title="Click to copy"
                    >
                      {field.value}
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>

        <template lwc:if={hasObjectOnly}>
          <div class="slds-grid slds-grid_vertical-align-start">
            <div class="slds-col slds-truncate">
              <p class="slds-text-title_caps">Object</p>
              <p class="slds-text-heading_small slds-m-bottom_x-small">
                {objectLabel} (<span class="sfi-mono">{objectApiName}</span>)
              </p>
            </div>
          </div>
          <p class="slds-text-body_small slds-m-bottom_x-small sfi-links">
            <span class="slds-text-color_weak">Links</span>
            <template for:each={setupLinks} for:item="link">
              <a key={link.key} href={link.url} target="_blank">{link.label}</a>
            </template>
          </p>
        </template>

        <template lwc:if={hasNoContext}>
          <p class="slds-m-bottom_x-small slds-text-color_weak">
            No record on this page. Paste a record Id to inspect it.
          </p>
          <div class="slds-grid">
            <lightning-input
              type="text"
              variant="label-hidden"
              placeholder="Record Id"
              value={idInput}
              onchange={handleIdInput}
              onkeyup={handleIdKeyUp}
              class="slds-col slds-m-right_x-small"
            ></lightning-input>
            <lightning-button
              variant="brand"
              label="Show All Data"
              onclick={handleOpenId}
            ></lightning-button>
          </div>
        </template>
      </template>

      <!-- Users tab (aligned on Salesforce Inspector Reloaded) -->
      <template lwc:if={isUsersTab}>
        <lightning-input
          type="search"
          variant="label-hidden"
          placeholder="Name, username, email or alias"
          value={userSearch}
          onchange={handleUserSearch}
          class="slds-m-bottom_x-small"
        ></lightning-input>
        <div class="sfi-fill">
          <template lwc:if={hasUserResults}>
            <ul class="slds-has-dividers_bottom-space slds-m-bottom_x-small">
              <template for:each={userResultRows} for:item="result">
                <li key={result.id} class="slds-item slds-p-vertical_xx-small">
                  <a href="#" data-id={result.id} onclick={handleUserPick}
                    >{result.name} ({result.alias})</a
                  >
                  <p
                    class="slds-text-body_small slds-text-color_weak slds-truncate"
                  >
                    {result.detail}
                  </p>
                </li>
              </template>
            </ul>
          </template>
          <template lwc:if={userError}>
            <div
              class="slds-notify slds-notify_alert slds-alert_error"
              role="alert"
            >
              {userError}
            </div>
          </template>
          <template lwc:if={isLoadingUser}>
            <div class="sfi-spinner-holder">
              <lightning-spinner
                alternative-text="Loading"
                size="small"
              ></lightning-spinner>
            </div>
          </template>
          <template lwc:if={user}>
            <table class="sfi-info-table">
              <tbody>
                <tr>
                  <th>Name</th>
                  <td class="slds-truncate">
                    <a href={userLinks.details} target="_blank">{user.name}</a>
                    <span class="slds-m-left_xx-small">({user.alias})</span>
                  </td>
                </tr>
                <tr>
                  <th>Username</th>
                  <td class="slds-truncate" title={user.username}>
                    {user.username}
                  </td>
                </tr>
                <tr>
                  <th>Id</th>
                  <td>
                    <a
                      href={userLinks.showAllData}
                      target="_blank"
                      class="sfi-mono"
                      >{user.id}</a
                    >
                    <lightning-button-icon
                      icon-name="utility:copy"
                      variant="bare"
                      size="small"
                      alternative-text="Copy Id"
                      title="Copy Id"
                      data-value={user.id}
                      onclick={handleCopy}
                      class="slds-m-left_xx-small"
                    ></lightning-button-icon>
                  </td>
                </tr>
                <tr>
                  <th>E-mail</th>
                  <td class="slds-truncate" title={user.email}>{user.email}</td>
                </tr>
                <tr>
                  <th>Profile</th>
                  <td class="slds-truncate">
                    <a href={userLinks.profile} target="_blank"
                      >{user.profileName}</a
                    >
                  </td>
                </tr>
                <tr>
                  <th>Role</th>
                  <td class="slds-truncate">{user.roleName}</td>
                </tr>
                <tr>
                  <th>Language</th>
                  <td>{userLanguage}</td>
                </tr>
              </tbody>
            </table>
            <div class="sfi-button-rows">
              <div class="slds-button-group" role="group">
                <a
                  href={userLinks.details}
                  target="_blank"
                  class="slds-button slds-button_neutral"
                  >Details</a
                >
                <a
                  href={userLinks.permissionSets}
                  target="_blank"
                  class="slds-button slds-button_neutral"
                  title="Show / assign user's permission sets"
                  >PSet</a
                >
                <a
                  href={userLinks.permissionSetGroups}
                  target="_blank"
                  class="slds-button slds-button_neutral"
                  title="Show / assign user's permission set groups"
                  >PSetG</a
                >
              </div>
              <div class="slds-button-group" role="group">
                <button
                  class="slds-button slds-button_neutral sfi-soon"
                  disabled
                  title="Needs the Tooling API (TraceFlag): coming soon"
                >
                  Enable Logs
                  <span
                    class="slds-badge slds-badge_lightest slds-m-left_xx-small"
                    >Soon</span
                  >
                </button>
                <button
                  class="slds-button slds-button_neutral"
                  disabled={isSavingUser}
                  onclick={handleToggleDebugMode}
                  title="Debug mode for Lightning components"
                >
                  {debugModeLabel}
                </button>
              </div>
              <template lwc:if={canLoginAs}>
                <div class="slds-button-group" role="group">
                  <a
                    href={userLinks.loginAs}
                    target="_blank"
                    class="slds-button slds-button_neutral"
                    >LoginAs</a
                  >
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>

      <!-- Search tab -->
      <template lwc:if={isSearchTab}>
        <div class="slds-grid slds-m-bottom_x-small">
          <lightning-combobox
            variant="label-hidden"
            label="Type"
            value={searchType}
            options={searchTypes}
            onchange={handleSearchType}
            class="sfi-search-type slds-m-right_x-small"
          ></lightning-combobox>
          <lightning-input
            type="search"
            variant="label-hidden"
            placeholder={searchPlaceholder}
            value={searchTerm}
            onchange={handleSearchTerm}
            is-loading={isSearching}
            class="slds-col"
          ></lightning-input>
        </div>
        <template lwc:if={searchError}>
          <div
            class="slds-notify slds-notify_alert slds-alert_error"
            role="alert"
          >
            {searchError}
          </div>
        </template>
        <div class="sfi-fill">
          <template lwc:if={hasSearchResults}>
            <ul class="slds-has-dividers_bottom-space">
              <template for:each={searchRows} for:item="result">
                <li key={result.id} class="slds-item slds-p-vertical_xx-small">
                  <a href={result.url} target="_blank" class="sfi-mono">
                    <lightning-formatted-rich-text
                      value={result.markedName}
                    ></lightning-formatted-rich-text>
                  </a>
                  <p
                    class="slds-text-body_small slds-text-color_weak slds-truncate"
                    title={result.detail}
                  >
                    {result.detail}
                  </p>
                </li>
              </template>
            </ul>
          </template>
          <template lwc:if={hasNoSearchResults}>
            <p class="slds-text-color_weak slds-p-around_small">No results.</p>
          </template>
        </div>
      </template>

      <!-- Tools tab: every SF Inspector tool, enabled as modules ship -->
      <template lwc:if={isToolsTab}>
        <div class="sfi-fill">
          <template for:each={toolSections} for:item="section">
            <div key={section.title} class="sfi-tool-section">
              <p class="slds-text-title_bold slds-m-bottom_x-small">
                {section.title}
              </p>
              <div class="sfi-tool-grid">
                <template for:each={section.tools} for:item="tool">
                  <a
                    key={tool.label}
                    href={tool.url}
                    target="_blank"
                    class={tool.className}
                    title={tool.title}
                    aria-disabled={tool.ariaDisabled}
                    onclick={handleToolClick}
                  >
                    {tool.label}
                    <template lwc:if={tool.soon}>
                      <span
                        class="slds-badge slds-badge_lightest slds-m-left_x-small"
                        >Soon</span
                      >
                    </template>
                  </a>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>
</template>
